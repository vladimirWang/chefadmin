# 生产：admin.hetou.vip（PostgreSQL 版本）
# 请将证书放到 nginx/ssl/：
#   admin.hetou.vip.pem
#   admin.hetou.vip.key
# 若使用 *.hetou.vip 通配符证书，复制或软链为上述文件名即可。

# HTTP 保留反代与静态；若仅写 return 301 → HTTPS，则 http://域名:6443/docker-api/ 会失效。
server {
    listen 80;
    server_name admin.hetou.vip _;

    root /usr/share/nginx/html;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /docker-api/ {
        proxy_pass http://ruoyi-backend-pg:9099/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name chefadmin.hetou.vip;

    root /usr/share/nginx/html;
    index index.html index.htm;

    ssl_certificate     /etc/ssl/cert/chefadmin.hetou.vip.pem;
    ssl_certificate_key /etc/ssl/cert/chefadmin.hetou.vip.key;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /docker-api/ {
        proxy_pass http://ruoyi-backend-pg:9099/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
