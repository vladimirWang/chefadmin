[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ruoyi-fastapi-backend-cli"
version = "1.9.0"
description = "RuoYi FastAPI backend internal CLI entrypoint"
requires-python = ">=3.10,<3.14"
dependencies = [
    "agno==2.4.8",
    "aiofiles==25.1.0",
    "alembic==1.18.3",
    "anthropic==0.78.0",
    "APScheduler==3.11.2",
    "async-lru==2.1.0",
    "bcrypt==5.0.0",
    "cerebras-cloud-sdk==1.67.0",
    "cohere==5.20.4",
    "fastapi[all]==0.128.2",
    "google-genai==1.62.0",
    "groq==1.0.0",
    "litellm==1.81.8",
    "llama-api-client==0.6.0",
    "loguru==0.7.3",
    "mistralai==1.12.0",
    "ollama==0.6.1",
    "openai==2.17.0",
    "openpyxl==3.1.5",
    "pandas==2.3.3",
    "Pillow==12.1.1",
    "portkey-ai==2.1.0",
    "psutil==7.2.2",
    "pydantic>=2.11.4",
    "pydantic-validation-decorator==0.1.5",
    "PyJWT[crypto]==2.11.0",
    "redis==7.1.0",
    "ruff==0.15.0",
    "SQLAlchemy[asyncio]==2.0.46",
    "sqlglot[rs]==28.10.0",
    "textual==8.2.5",
    "user-agents==2.2.0",
]

[project.optional-dependencies]
pg = [
    "asyncpg==0.31.0",
    "psycopg2==2.9.11",
]

[project.scripts]
ruoyi = "cli.main:main"

[tool.setuptools.packages.find]
include = ["cli*"]

[tool.uv]
package = true

# 配置双索引源：优先清华镜像源，其次官方 PyPI
[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
name = "tsinghua"
default = true

[[tool.uv.index]]
url = "https://pypi.org/simple"
name = "pypi"
