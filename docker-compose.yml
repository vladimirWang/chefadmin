services:
  # 前端服务
  ruoyi-frontend:
    build:
      context: ./nginx
      args:
        NGINX_SITE: pg
    image: ruoyi-frontend:latest
    container_name: ruoyi-frontend
    ports:
      - "6443:80"
      - "6444:443"
    volumes:
      - ./nginx/html/dist:/usr/share/nginx/html:ro
      - ./nginx/ssl:/etc/ssl/cert:ro
    depends_on:
      - ruoyi-backend-pg
    networks:
      - ruoyi-network

  # 后端服务（PostgreSQL版本）
  ruoyi-backend-pg:
    build:
      context: ./ruoyi-fastapi-backend
      dockerfile: Dockerfile
    image: ruoyi-backend-pg:latest
    container_name: ruoyi-backend-pg
    ports:
      - "19099:9099"
    depends_on:
      # ruoyi-pg:
      #   condition: service_healthy
      ruoyi-redis:
        condition: service_healthy
    networks:
      - ruoyi-network
      - private_chef_network

  # # PostgreSQL服务
  # ruoyi-pg:
  #   image: postgres:14
  #   container_name: ruoyi-pg
  #   environment:
  #     POSTGRES_PASSWORD: root
  #     POSTGRES_DB: ruoyi-fastapi
  #     POSTGRES_INITDB_ARGS: --encoding=UTF8 --lc-collate=C --lc-ctype=C
  #   ports:
  #     - "15432:5432"
  #   volumes:
  #     - ./ruoyi-fastapi-backend/sql/ruoyi-fastapi-pg.sql:/docker-entrypoint-initdb.d/ruoyi-fastapi-pg.sql
  #   networks:
  #     - ruoyi-network
  #   healthcheck:
  #     test: ["CMD", "pg_isready", "-U", "postgres"]
  #     interval: 5s
  #     timeout: 10s
  #     retries: 30

  # Redis服务
  ruoyi-redis:
    image: redis:latest
    container_name: ruoyi-redis
    ports:
      - "16379:6379"
    networks:
      - ruoyi-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 10s
      retries: 30

# 网络配置
networks:
  ruoyi-network:
    name: ruoyi-network
    driver: bridge

  private_chef_network:
    name: private_chef_network
    external: true